apiVersion: apps/v1
kind: Deployment
metadata:
  name: zerodowntime-app
  labels:
    app: zerodowntime-app
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: zerodowntime-app
  template:
    metadata:
      labels:
        app: zerodowntime-app
    spec:
      containers:
      - name: web
        image: hashicorp/http-echo:0.2.3
        args:
          - "-text=Hello from ZeroDowntime Lab v1.0!"
        ports:
        - containerPort: 5678
        readinessProbe:
          httpGet:
            path: /
            port: 5678
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 5678
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: zerodowntime-service
spec:
  type: ClusterIP
  selector:
    app: zerodowntime-app
  ports:
    - port: 80
      targetPort: 5678
