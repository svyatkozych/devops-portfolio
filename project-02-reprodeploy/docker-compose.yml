version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: reprodeploy_db
    restart: always
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: secure_password
      POSTGRES_DB: app_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-net

  web:
    build: ./app
    container_name: reprodeploy_web
    restart: always
    environment:
      - DB_HOST=db
      - DB_NAME=app_db
      - DB_USER=app_user
      - DB_PASSWORD=secure_password
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-net

  nginx:
    image: nginx:alpine
    container_name: reprodeploy_nginx
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    networks:
      - app-net

volumes:
  postgres_data:

networks:
  app-net:
    driver: bridgeversion: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: reprodeploy_db
    restart: always
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: secure_password
      POSTGRES_DB: app_db
    ports:
      -"5432.5432"
    volumes:
      -postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD_SHELL", "pg_isready -U app_user -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
